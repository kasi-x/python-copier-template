author_orcid:
    type: str
    default: ""
    when: "{{ detail_level == 'detailed' and fair }}"
    help: |
        Your ORCID iD (e.g. 0000-0002-1825-0099), recorded in CITATION.cff
        so citation systems can attribute you correctly. Leave empty to skip.

pypi:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: Would you like the wheel and source distribution to be automatically uploaded to PyPI when a release is made?

cloud_provider:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Which cloud provider will this project deploy to?
        - none: no cloud-specific code or dependencies.
        - aws: boto3 and service-specific dependencies are added.
        - gcp: google-cloud-storage is added.
        - azure: azure-identity is added.
    choices:
        - none
        - aws
        - gcp
        - azure
    default: none

aws_services:
    type: str
    when: "{{ detail_level == 'detailed' and cloud_provider == 'aws' }}"
    help: |
        Which AWS services will you use?
        - essential: core services (S3, SQS, DynamoDB, Lambda types).
        - s3: just S3.
        - dynamodb: just DynamoDB.
        - sqs: just SQS.
        - lambda: just Lambda.
    choices:
        - essential
        - s3
        - dynamodb
        - sqs
        - lambda
    default: essential

include_sentry:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Would you like to include Sentry for error tracking?
        If yes, sentry-sdk is added and initialised from SENTRY_DSN.
    default: false

include_mcp:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Would you like to include MCP (Model Context Protocol) support?
        If yes, the mcp SDK is added with stdio and SSE transports.
    default: false

ci_provider:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Which CI provider would you like to use?
        - github_actions: GitHub Actions workflows for lint, type-checking,
          tests and docs.
        - none: no CI workflows are generated.
    choices:
        - github_actions
        - none
    default: github_actions

specialty:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Is this project specialised for a particular domain? This adds
        domain-specific structure on top of the base toolchain.
        - none: no specialisation.
        - mcp_server: an MCP (Model Context Protocol) server with stdio/SSE
          transports and an inspector script.
        - ai_agent: an LLM agent / RAG app with a tools/ folder, prompts/
          directory and pydantic-settings.
        - data_polars: a Polars + DuckDB data pipeline with zero-copy Arrow
          sharing and a data boundary layout.
        - rust_extension: a PyO3 / maturin Rust extension with Cargo.toml and
          cross-compilation CI.
        - pure_python_web: a FastHTML full-stack web app with hot reload.
    choices:
        - none
        - mcp_server
        - ai_agent
        - data_polars
        - rust_extension
        - pure_python_web
    default: none

# Project Details
package_name:
    type: str
    help: |
        Name of the python import package.
        Must be a valid python identifier, i.e. my_package.
        ASCII characters only (a-z, A-Z, 0-9, _).
    validator: >-
        {% if not (package_name | regex_search('^[a-zA-Z][a-zA-Z_0-9]+$')) %}
        {{ package_name }} is not a valid python package name. Use ASCII letters, digits and underscores only.
        {% endif %}

description:
    type: str
    help: A short description of your project
    placeholder: One line description of your module

git_platform:
    type: str
    help: Git platform hosting the repository
    choices:
        - github.com
        - gitlab.com

github_org:
    type: str
    help: |
        GitHub organisation or username that will contain this repo.
        Set to your GitHub username (e.g. kasi-x) for a personal repo,
        or the name of an organisation you belong to.
    when: "{{ git_platform == 'github.com' }}"
    default: "{{ github_username() }}"

gitlab_group:
    type: str
    help: |
        GitLab group (or username) that will contain this repo.
    when: "{{ git_platform == 'gitlab.com' }}"

repo_name:
    type: str
    help: |
        Name of the repository.
        Generally the package name with underscores replaced by dashes.
    default: "{{ package_name | replace('_', '-') }}"
    validator: >-
        {% if not (repo_name | regex_search('^[a-zA-Z][a-zA-Z_\\.\\-0-9]+$')) %}
        {{ repo_name }} is not a valid repo name. Use ASCII letters, digits, dashes and underscores only.
        {% endif %}

distribution_name:
    type: str
    help: |
        Name of the python distribution package that will be created.
        This is what people will `pip install`.
        Generally the same as the repo name unless there is a name clash on PyPI.
    default: "{{ repo_name }}"

author_name:
    type: str
    help: Your full name
    default: "{{ git_user_name() }}"
    placeholder: FirstName LastName

author_email:
    type: str
    help: Your email address
    default: "{{ git_user_email() }}"
    placeholder: email@diamond.ac.uk

# Internal variables
data_science:
    type: bool
    default: "{{ project_type == 'data_science' }}"
    when: false

use_gpu_effective:
    type: bool
    default: "{{ use_gpu if detail_level == 'detailed' else (project_type == 'data_science') }}"
    when: false

repo_url:
    type: str
    default: "https://github.com/{{github_org}}/{{repo_name}}"
    when: false

docs_url:
    type: str
    default: "https://{{github_org | lower}}.github.io/{{repo_name}}"
    when: false

sphinx:
    type: bool
    default: "{{ docs_type == 'sphinx' }}"
    when: false

zensical:
    type: bool
    default: "{{ docs_type == 'zensical' }}"
    when: false

great_docs:
    type: bool
    default: "{{ docs_type == 'great-docs' }}"
    when: false

docs:
    type: bool
    default: "{{ docs_type != 'README' }}"
    when: false

task_runner_effective:
    type: str
    default: "{{ task_runner_pixi if package_manager == 'pixi' else task_runner }}"
    when: false

license_effective:
    type: str
    default: "{{ license if detail_level == 'detailed' else license_simple }}"
    when: false

reuse_effective:
    type: bool
    default: "{{ fair and license_effective != 'Proprietary' }}"
    when: false

duo:
    type: bool
    default: "{{ fair and data_science and not competition and data_governance in ['duo', 'both'] }}"
    when: false

care:
    type: bool
    default: "{{ fair and data_science and not competition and data_governance in ['care', 'both'] }}"
    when: false

license_year:
    type: str
    default: "{{ current_year() }}"
    when: false

pkg_dir:
    type: str
    default: "{{ 'src/utils' if competition else (('src/' if layout == 'src' and project_type != 'script' else '') + package_name) }}"
    when: false

_subdirectory: "template"

_skip_if_exists:
    - CHANGELOG.md

_tasks:
    - >-
        {% if ascii_banner %}
        python -B tools/ascii_banner.py {{ repo_name }} README.md
        {% endif %}
    - >-
        {% if reuse_effective %}
        python -c "import pathlib, shutil; pathlib.Path('LICENSES').mkdir(exist_ok=True); shutil.copy('LICENSE', 'LICENSES/{{ license_effective }}.txt')"
        {% endif %}

_migrations:
    - version: 2.0.0
      before:
          - echo This update will require you to login to pypi.org and make changes before you can make a new release to PyPI. If you do not have time to do this now, press CTRL+C to abort this update.
      after:
          - echo Visit https://diamondlightsource.github.io/python-copier-template/main/how-to/pypi.html to find out how to set up PyPI trusted publishing
