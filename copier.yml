_jinja_extensions:
    - copier_template_extensions.TemplateExtensionLoader
    - extensions.py:GitExtension
    - extensions.py:CurrentYearExtension
---
# Template Options
#
# The questionnaire is split into fragments under questions/, included here
# in ask order. Copier resolves `!include` relative to this file and merges
# keys so the document order below IS the question order.
#
# Ordering rules (enforced by tests/test_copier_structure.py):
# - project_type is asked first: the area gates and several `default`s depend
#   on it.
# - The use_recommended_* gates keep their canonical relative order (see
#   CANONICAL_GATES in the test) — each asks "use the recommended settings?"
#   first (default: yes); answering No reveals that area's detail questions.
# - Genre-derived internal variables (when: false) that a question references
#   (micropython_pkg, online_judge, kaggle, oj_code) live in their genre fragment
#   BEFORE that question, so the reference resolves.
# - questions/_combo.yml (include_data_science / include_web_api plus the
#   has_* effective booleans) sits after questions/online_judge.yml (it
#   references kaggle) and before questions/data_science.yml and
#   questions/web_api.yml (their gates reference has_data_science /
#   has_web_api).

project_type:
    type: str
    help: |
        What kind of project is this?
        - library: a Python library/package.
        - web_api: a web API service (Docker included).
        - cli: a command-line tool.
        - data_science: a data science project with notebooks, data/,
          models/, reports/ and experiment extras. GPU Dockerfile and
          Quarto paper are included.
        - online_judge: a competitive-programming / Kaggle project. The
          rules for AI coding agents differ per judge, which decides
          whether an AGENTS.md file is generated.
        - script: a minimal script, no package layout.
        - web_django: NOT supported. Selecting this aborts generation —
          Django is not maintained by this template; use FastAPI /
          Litestar / Flask, or the upstream cookiecutter-django instead.
        - ros2: a ROS 2 package (ament_python or ament_cmake). Built with
          colcon + rosdep; not a uv/pixi/poetry project.
        - micropython: MicroPython firmware for a microcontroller (esp32,
          rp2, ...). Deployed with mpremote; the CPython dev toolchain
          (uv/ruff/pytest/basedpyright) coexists for testing and type-checking
          against micropython-<port>-stubs.
    choices:
        - library
        - web_api
        - cli
        - data_science
        - online_judge
        - script
        - web_django
        - ros2
        - micropython
    default: library
---
# Genre follow-up questions (asked right after project_type, before the
# cross-cutting gates). Each include is its own YAML document: two
# `!include` tags in one document would collide as the same mapping key.
!include questions/ros2.yml
---
!include questions/micropython.yml
---
# Cross-cutting gates, block A: agent + toolchain.
!include questions/_common_a.yml
---
# Genre gates that keep their canonical position mid-sequence.
!include questions/online_judge.yml
---
# Combo opt-ins (base + layer; see questions/_combo.yml). No
# use_recommended_* gates in here, so the canonical gate order is untouched.
!include questions/_combo.yml
---
!include questions/data_science.yml
---
# Cross-cutting gates, block B: polish, docs, quality, license, integrations.
!include questions/_common_b.yml
---
# Genre gate that keeps its canonical position (after integrations).
!include questions/web_api.yml
---
# Cross-cutting gates, block C: security, then Project Details.
!include questions/_common_c.yml
---
# Derived internal variables (when: false) — last: nothing asks them, they
# feed template rendering.
!include questions/_internal.yml
---
# Template settings (underscore keys). Copier merges these across fragments;
# they are kept here in one place so the template's runtime behaviour is
# documented in a single spot. `questions/` holds the include fragments, so
# it must never be copied into a generated project.
_subdirectory: "template"

_exclude:
    - questions

_skip_if_exists:
    - CHANGELOG.md

_tasks:
    - command: >-
        python -c "import sys; print('Django is not supported by this template. Use FastAPI / Litestar / Flask instead, or the upstream cookiecutter-django template: https://github.com/cookiecutter/cookiecutter-django'); sys.exit(1)"
      when: "{{ project_type == 'web_django' }}"
    - >-
        {% if reuse_effective %}
        python -c "import pathlib, shutil; pathlib.Path('LICENSES').mkdir(exist_ok=True); shutil.copy('LICENSE', 'LICENSES/{{ license_effective }}.txt')"
        {% endif %}

_migrations:
    - version: 2.0.0
      before:
          - echo This update will require you to login to pypi.org and make changes before you can make a new release to PyPI. If you do not have time to do this now, press CTRL+C to abort this update.
      after:
          - echo Visit https://kasi-x.github.io/python-copier-template/main/how-to/pypi.html to find out how to set up PyPI trusted publishing
