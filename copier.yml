_jinja_extensions:
    - copier_template_extensions.TemplateExtensionLoader
    - extensions.py:GitExtension
    - extensions.py:CurrentYearExtension

# Template Options
#
# Each customisable area asks a single "use the recommended settings?"
# question first (default: yes). Answering No to that question reveals the
# detailed question(s) for that area; answering Yes accepts the recommended
# defaults listed in its help text without asking anything further.
#
# project_type (and its ros2 follow-ups) is asked first, ahead of every
# area, because use_recommended_toolchain/package_manager's own `when` and
# `default` need to know whether this is a ros2+pixi project.

project_type:
    type: str
    help: |
        What kind of project is this?
        - library: a Python library/package.
        - web_api: a web API service (Docker included).
        - cli: a command-line tool.
        - data_science: a data science project with notebooks, data/,
          models/, reports/ and experiment extras. GPU Dockerfile and
          Quarto paper are included.
        - script: a minimal script, no package layout.
        - web_django: NOT supported. Selecting this aborts generation —
          Django is not maintained by this template; use FastAPI /
          Litestar / Flask, or the upstream cookiecutter-django instead.
        - ros2: a ROS 2 package (ament_python or ament_cmake). Built with
          colcon + rosdep; not a uv/pixi/poetry project.
        - micropython: MicroPython firmware for a microcontroller (esp32,
          rp2, ...). Deployed with mpremote; the CPython dev toolchain
          (uv/ruff/pytest/basedpyright) coexists for testing and type-checking
          against micropython-<port>-stubs.
    choices:
        - library
        - web_api
        - cli
        - data_science
        - script
        - web_django
        - ros2
        - micropython
    default: library

pkg_language:
    type: str
    when: "{{ project_type == 'ros2' }}"
    help: |
        Which language for the ROS 2 package?
        - python: ament_python (rclpy) — setup.py + package.xml + resource/.
        - cpp: ament_cmake — CMakeLists.txt + src/*.cpp + include/.
    choices:
        Python (rclpy): python
        C++ (ament_cmake): cpp
    default: python

ros_distro:
    type: str
    when: "{{ project_type == 'ros2' }}"
    help: |
        ROS 2 distribution. Humble (Ubuntu 22.04, Python 3.10) is the most
        widely deployed; Jazzy (Ubuntu 24.04, Python 3.12) is the current LTS.
    choices:
        Humble (22.04 / Python 3.10): humble
        Jazzy (24.04 / Python 3.12): jazzy
    default: humble

ros2_package_manager:
    type: str
    when: "{{ project_type == 'ros2' }}"
    help: |
        How should the ROS 2 environment be provisioned?
        - apt: the classic ROS 2 way — Ubuntu + apt (ros-{{ ros_distro }}-*)
          + colcon + rosdep. Docker base image ros:{{ ros_distro }}-ros-base.
        - pixi: RoboStack conda-forge packages via pixi, using the distro
          channel (https://prefix.dev/robostack-{{ ros_distro }}). No
          sudo/apt needed. See https://pixi.prefix.dev/latest/robotics/.
    choices:
        apt (colcon + rosdep): apt
        pixi (RoboStack conda): pixi
    default: apt

micropython_port:
    type: str
    when: "{{ project_type == 'micropython' }}"
    help: |
        Which MicroPython port are you targeting? This picks the
        micropython-<port>-stubs package used for type-checking.
        - esp32: ESP32 family (most common; default)
        - esp8266: ESP8266 (legacy, low memory)
        - rp2: Raspberry Pi Pico / RP2040 / RP2350
        - stm32: STM32 family (Pyboard etc.)
        - samd: Microchip SAMD21 / SAMD51
        - unix: Unix port (runs on your computer — handy for testing)
        - windows: Windows port
        - mimxrt: NXP i.MX RT family (Teensy 4.x etc.)
        Stubs are per-port (generic board); board-specific pins and hardware
        live in firmware/board_config.py so switching boards is a one-file edit.
    choices:
        ESP32: esp32
        ESP8266: esp8266
        RP2 (Pico): rp2
        STM32: stm32
        SAMD: samd
        Unix: unix
        Windows: windows
        MIMXRT: mimxrt
    default: esp32

use_recommended_toolchain:
    type: bool
    when: "{{ not (project_type == 'ros2' and ros2_package_manager == 'pixi') }}"
    default: true
    help: |
        Use the recommended package manager & task runner?
        Recommended: uv (package manager) + just (task runner).
        Answer No to pick pixi/poetry, or a different task runner.
        (For ros2 projects with the pixi ROS environment, pixi manages
        everything — the package-manager question is not asked.)

package_manager:
    type: str
    when: "{{ not use_recommended_toolchain and not (project_type == 'ros2' and ros2_package_manager == 'pixi') }}"
    help: |
        Which package manager would you like to use?
        - uv: Fast, pure Python package manager with a pip-like workflow.
        - pixi: Conda-based package manager with cross-language support.
        - poetry: Dependency management and packaging with Poetry.
        Choose pixi if you need native (non-Python) dependencies.
        (For ros2 projects the package manager manages the pure-Python dev
        tooling — ruff/pytest/pre-commit; the ROS environment itself is
        provided by ros2_package_manager. When the ROS environment is pixi,
        pixi manages everything, so this question is not asked. When it is
        apt, pixi is not offered — one package manager at a time.)
    choices: |
        {%- if project_type == 'ros2' and ros2_package_manager == 'apt' %}
        - uv
        - poetry
        {%- else %}
        - uv
        - pixi
        - poetry
        {%- endif %}
    default: "{{ 'pixi' if project_type == 'ros2' and ros2_package_manager == 'pixi' else 'uv' }}"

task_runner:
    type: str
    when: "{{ not use_recommended_toolchain and package_manager != 'pixi' }}"
    help: |
        Which task runner would you like to use to drive lint / type-check /
        test / docs (and, for data_science's competition sub-option, the ML
        pipeline shortcuts)?
        - just: Just. Simple justfile, external binary.
        - task: Task (go-task). YAML, external binary, used by CI too.
        - poe: poethepoet. Pure Python, lives in pyproject.toml, no extra
          binary to install (just a dev dependency).
        - make: GNU Make. Universally available, terse Makefile syntax.
        - invoke: pyinvoke. Pure Python, tasks.py with @task-decorated
          functions, no extra binary to install (just a dev dependency).
        - duty: duty (used by pawamoy's copier-uv). Pure Python, duties.py
          with @duty-decorated functions, no extra binary to install.
    choices:
        Just: just
        Task (go-task): task
        poethepoet: poe
        Make: make
        pyinvoke: invoke
        duty: duty
    default: just

task_runner_pixi:
    type: str
    when: "{{ not use_recommended_toolchain and package_manager == 'pixi' }}"
    help: |
        Which task runner would you like to use? (poethepoet doesn't work
        with pixi, so pixi's own native tasks take its place here.)
        - pixi: pixi's own native tasks (`pixi run <name>`). No extra tool.
        - task: Task (go-task). YAML, external binary, used by CI too.
        - just: Just. Simple justfile, external binary.
        - make: GNU Make. Universally available, terse Makefile syntax.
    choices:
        pixi (native tasks): pixi
        Task (go-task): task
        Just: just
        Make: make
    default: pixi

use_recommended_data_science:
    type: bool
    when: "{{ project_type == 'data_science' }}"
    default: true
    help: |
        Use the recommended data_science options?
        Recommended: not a Kaggle-style competition, GPU workloads enabled
        (NVIDIA CUDA Dockerfile + devcontainer), and — for non-competition
        projects — no DUO data-use sheet or CARE governance statement.
        Answer No to change any of these.

competition:
    type: bool
    when: "{{ project_type == 'data_science' and not use_recommended_data_science }}"
    help: |
        Is this a Kaggle-style competition project?
        If yes, input/ and exp/ directories are added for competition data
        and experiments.
    default: false

use_gpu:
    type: bool
    when: "{{ project_type == 'data_science' and not use_recommended_data_science }}"
    help: |
        Will you run GPU workloads?
        If yes, an NVIDIA CUDA Dockerfile and devcontainer are prepared.
        Recommended (and the default) for data_science projects.
    default: true

data_reusable:
    type: bool
    when: "{{ project_type == 'data_science' and not use_recommended_data_science and not competition }}"
    help: |
        Will this data be shared or reused outside the team (e.g.
        published, or handed to collaborators/another organisation)?
        If yes, a DUO (Data Use Ontology) data-use conditions sheet is
        added to data/ so the reuse conditions are documented up front.
    default: false

data_ethics:
    type: bool
    when: "{{ project_type == 'data_science' and not use_recommended_data_science and not competition }}"
    help: |
        Does this data need ethical / data-governance consideration (e.g.
        human subjects, indigenous data, other sensitive personal data)?
        If yes, a CARE principles data-governance statement is added to
        data/ so those considerations are documented and tracked.
    default: false

use_recommended_polish:
    type: bool
    default: true
    help: |
        Use the recommended layout & repo polish?
        Recommended: src/ layout (library/web_api/cli), no Japanese
        (multibyte) characters in comments/docstrings, an ASCII-art repo-name
        banner at the top of the README.
        Answer No to change the layout, allow Japanese text, or skip the
        banner.

layout:
    type: str
    when: "{{ project_type not in ['data_science', 'ros2', 'micropython'] and not use_recommended_polish }}"
    help: |
        Which layout would you like to use for the package?
        - src: package in a src/ directory (recommended, prevents accidental
               imports of an uninstalled package).
        - flat: package at the repository root.
    choices:
        - src
        - flat
    default: src

allow_japanese:
    type: bool
    when: "{{ not use_recommended_polish }}"
    help: |
        Allow Japanese (multibyte) characters in comments and docstrings?
        If true, ruff's line-length and max-doc-length are relaxed so that
        wide multibyte characters do not trigger E501/D rules.
    default: false

ascii_banner:
    type: bool
    when: "{{ not use_recommended_polish }}"
    help: |
        Add an ASCII-art banner of the repo name to the top of the README?
        This bundles a small MIT-licensed copy of pyfiglet (with the slant
        font) so the banner can be regenerated without extra dependencies.
    default: true

use_recommended_docs:
    type: bool
    default: true
    help: |
        Use the recommended documentation tool?
        Recommended: zensical (Zensical, an MkDocs fork with mkdocstrings).
        Answer No to pick README-only, Sphinx or Great Docs instead.
        (For ros2 projects the docs build needs a sourced ROS environment,
        e.g. the devcontainer or CI.)

docs_type:
    type: str
    when: "{{ not use_recommended_docs }}"
    help: |
        Which documentation tool would you like to use?
        - README: just a README, no dedicated docs site.
        - zensical: Zensical, an MkDocs fork with mkdocstrings. Fast to set up.
        - sphinx: Sphinx with the pydata theme. More powerful, more config.
        - great-docs: Great Docs, a Quarto-based tool. Requires Quarto installed.
        (For micropython projects, Sphinx is not offered: the firmware is not
        a CPython-importable package, and zensical can document firmware/core.)
    choices: |
        {%- if micropython_pkg %}
        - README
        - zensical
        - great-docs
        {%- else %}
        - README
        - zensical
        - sphinx
        - great-docs
        {%- endif %}
    default: zensical

use_recommended_quality:
    type: bool
    default: true
    help: |
        Use the recommended type checker & strictness level?
        Recommended: basedpyright, strictness "recommended" (ruff ALL rules,
        basedpyright + pyrefly, typos/vulture/deptry/pip-audit).
        Answer No to pick pyrefly instead, or a different strictness level.

type_checker:
    type: str
    when: "{{ not use_recommended_quality }}"
    help: |
        What type checker would you like to use?
        Basedpyright (pyright の fork) is recommended: 実バグ検出を重視しつつ、
        警告レベルを制御しやすい。Pyrefly (Meta) は軽量で補助に使える。
    choices:
        - basedpyright
        - pyrefly
    default: basedpyright

strictness:
    type: str
    when: "{{ not use_recommended_quality }}"
    help: |
        How strict should the toolchain be? One axis controls both the
        type-annotation requirements and the static-analysis toolchain.
        - none: pytest + ruff (minimal rules), no type checking.
        - basic: pytest + ruff, no type checking.
        - recommended: ruff (ALL rules), basedpyright + pyrefly,
          typos/vulture/deptry/pip-audit, driven by your chosen task runner.
          Recommended default.
        - full: recommended + strict type checking (Any forbidden),
          minimized ruff ignores, full annotations required.
    choices:
        - none
        - basic
        - recommended
        - full
    default: recommended

use_recommended_license:
    type: bool
    default: true
    help: |
        Use the recommended license & metadata settings?
        Recommended: MIT license, no FAIR research-software metadata
        (CITATION.cff / REUSE).
        Answer No to pick a different license or opt into FAIR metadata.

license:
    type: str
    when: "{{ not use_recommended_license }}"
    help: |
        Which license would you like to use?
        The full list from https://choosealicense.com, generated by
        tools/generate_license_template.py.
    choices:
        Academic Free License v3.0: AFL-3.0
        Apache License 2.0: Apache-2.0
        Artistic License 2.0: Artistic-2.0
        BSD 2-Clause "Simplified" License: BSD-2-Clause
        BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
        BSD 3-Clause Clear License: BSD-3-Clause-Clear
        BSD 4-Clause "Original" or "Old" License: BSD-4-Clause
        BSD Zero Clause License: 0BSD
        BSD-2-Clause Plus Patent License: BSD-2-Clause-Patent
        Blue Oak Model License 1.0.0: BlueOak-1.0.0
        Boost Software License 1.0: BSL-1.0
        CERN Open Hardware Licence Version 2 - Permissive: CERN-OHL-P-2.0
        CERN Open Hardware Licence Version 2 - Strongly Reciprocal: CERN-OHL-S-2.0
        CERN Open Hardware Licence Version 2 - Weakly Reciprocal: CERN-OHL-W-2.0
        CeCILL Free Software License Agreement v2.1: CECILL-2.1
        Creative Commons Attribution 4.0 International: CC-BY-4.0
        Creative Commons Attribution Share Alike 4.0 International: CC-BY-SA-4.0
        Creative Commons Zero v1.0 Universal: CC0-1.0
        Do What The F*ck You Want To Public License: WTFPL
        Eclipse Public License 1.0: EPL-1.0
        Eclipse Public License 2.0: EPL-2.0
        Educational Community License v2.0: ECL-2.0
        European Union Public License 1.1: EUPL-1.1
        European Union Public License 1.2: EUPL-1.2
        GNU Affero General Public License v3.0: AGPL-3.0
        GNU Free Documentation License v1.3: GFDL-1.3
        GNU General Public License v2.0: GPL-2.0
        GNU General Public License v3.0: GPL-3.0
        GNU Lesser General Public License v2.1: LGPL-2.1
        GNU Lesser General Public License v3.0: LGPL-3.0
        ISC License: ISC
        LaTeX Project Public License v1.3c: LPPL-1.3c
        MIT License: MIT
        MIT No Attribution: MIT-0
        Microsoft Public License: MS-PL
        Microsoft Reciprocal License: MS-RL
        Mozilla Public License 2.0: MPL-2.0
        Mulan Permissive Software License, Version 2: MulanPSL-2.0
        Open Data Commons Open Database License v1.0: ODbL-1.0
        Open Software License 3.0: OSL-3.0
        PostgreSQL License: PostgreSQL
        SIL Open Font License 1.1: OFL-1.1
        The Unlicense: Unlicense
        Universal Permissive License v1.0: UPL-1.0
        University of Illinois/NCSA Open Source License: NCSA
        Vim License: Vim
        zlib License: Zlib
        Proprietary / all rights reserved: Proprietary
        Confidential / trade secrets: Confidential
    default: MIT

fair:
    type: bool
    when: "{{ not use_recommended_license }}"
    help: |
        Add FAIR research-software metadata?
        - CITATION.cff for software citation, validated by a pre-commit hook
          (an optional ORCID iD is asked below when enabled)
        - REUSE.toml with SPDX annotations, checked by the reuse hook — but
          only when an open-source license is selected; Proprietary projects
          skip REUSE
        (data_science's DUO/CARE data-governance sheets are asked separately,
        alongside the competition question above — they don't depend on this.)
    default: false

author_orcid:
    type: str
    default: ""
    when: "{{ not use_recommended_license and fair }}"
    help: |
        Your ORCID iD (e.g. 0000-0002-1825-0099), recorded in CITATION.cff
        so citation systems can attribute you correctly. Leave empty to skip.

use_recommended_integrations:
    type: bool
    default: true
    help: |
        Use the recommended deployment & integration settings?
        Recommended: no Docker container, no PyPI auto-publish, no cloud
        provider, no Sentry, no MCP support, GitHub Actions for CI,
        structlog for logging.
        Answer No to turn any of these on, switch the CI provider, or pick a
        different logging library.

docker:
    type: bool
    when: "{{ not use_recommended_integrations and project_type != 'micropython' }}"
    help: |
        Would you like to publish your project in a Docker container?
        You should select this if you are making a service.
    default: false

pypi:
    type: bool
    when: "{{ not use_recommended_integrations }}"
    help: Would you like the wheel and source distribution to be automatically uploaded to PyPI when a release is made?
    default: false

cloud_provider:
    type: str
    when: "{{ not use_recommended_integrations }}"
    help: |
        Which cloud provider will this project deploy to?
        - none: no cloud-specific code or dependencies.
        - aws: boto3 and service-specific dependencies are added.
        - gcp: google-cloud-storage is added.
        - azure: azure-identity is added.
    choices:
        - none
        - aws
        - gcp
        - azure
    default: none

aws_services:
    type: str
    when: "{{ not use_recommended_integrations and cloud_provider == 'aws' }}"
    help: |
        Which AWS services will you use?
        - essential: core services (S3, SQS, DynamoDB, Lambda types).
        - s3: just S3.
        - dynamodb: just DynamoDB.
        - sqs: just SQS.
        - lambda: just Lambda.
    choices:
        - essential
        - s3
        - dynamodb
        - sqs
        - lambda
    default: essential

include_sentry:
    type: bool
    when: "{{ not use_recommended_integrations }}"
    help: |
        Would you like to include Sentry for error tracking?
        If yes, sentry-sdk is added and initialised from SENTRY_DSN.
    default: false

include_mcp:
    type: bool
    when: "{{ not use_recommended_integrations }}"
    help: |
        Would you like to include MCP (Model Context Protocol) support?
        If yes, the mcp SDK is added with stdio and SSE transports.
    default: false

ci_provider:
    type: str
    when: "{{ not use_recommended_integrations }}"
    help: |
        Which CI provider would you like to use?
        - github_actions: GitHub Actions workflows for lint, type-checking,
          tests and docs.
        - none: no CI workflows are generated.
    choices:
        - github_actions
        - none
    default: github_actions

log_library:
    type: str
    when: "{{ not use_recommended_integrations and project_type not in ['ros2', 'micropython'] }}"
    help: |
        Which logging library should logging_setup.py use?
        - structlog: structured, contextvars-aware logging with console/JSON
          renderers. Recommended default.
        - loguru: batteries-included logger — no boilerplate configuration,
          built-in colours, exception-catching decorator.
        - picologging: a C-accelerated, drop-in-compatible reimplementation
          of the standard library logging module. Faster, same API.
        - logging: the standard library logging module. No extra dependency.
    choices:
        - structlog
        - loguru
        - picologging
        - logging
    default: structlog

use_recommended_specialty:
    type: bool
    default: true
    help: |
        Skip domain specialisation?
        Recommended: none — a plain project with no extra domain-specific
        structure on top of the base toolchain.
        Answer No to add mcp_server / ai_agent / data_polars /
        rust_extension / pure_python_web scaffolding.

specialty:
    type: str
    when: "{{ not use_recommended_specialty }}"
    help: |
        Is this project specialised for a particular domain? This adds
        domain-specific structure on top of the base toolchain.
        - none: no specialisation.
        - mcp_server: an MCP (Model Context Protocol) server with stdio/SSE
          transports and an inspector script.
        - ai_agent: an LLM agent / RAG app with a tools/ folder, prompts/
          directory and pydantic-settings.
        - data_polars: a Polars + DuckDB data pipeline with zero-copy Arrow
          sharing and a data boundary layout.
        - rust_extension: a PyO3 / maturin Rust extension with Cargo.toml and
          cross-compilation CI.
        - pure_python_web: a FastHTML full-stack web app with hot reload.
    choices:
        - none
        - mcp_server
        - ai_agent
        - data_polars
        - rust_extension
        - pure_python_web
    default: none

# Project Details
package_name:
    type: str
    help: |
        Name of the python import package.
        Must be a valid python identifier, i.e. my_package.
        ASCII characters only (a-z, A-Z, 0-9, _).
    validator: >-
        {% if not (package_name | regex_search('^[a-zA-Z][a-zA-Z_0-9]+$')) %}
        {{ package_name }} is not a valid python package name. Use ASCII letters, digits and underscores only.
        {% endif %}

description:
    type: str
    help: A short description of your project
    placeholder: One line description of your module

git_platform:
    type: str
    help: Git platform hosting the repository
    choices:
        - github.com
        - gitlab.com

github_org:
    type: str
    help: |
        GitHub organisation or username that will contain this repo.
        Set to your GitHub username (e.g. kasi-x) for a personal repo,
        or the name of an organisation you belong to.
    when: "{{ git_platform == 'github.com' }}"
    default: "{{ github_username() }}"

gitlab_group:
    type: str
    help: |
        GitLab group (or username) that will contain this repo.
    when: "{{ git_platform == 'gitlab.com' }}"

repo_name:
    type: str
    help: |
        Name of the repository.
        Generally the package name with underscores replaced by dashes.
    default: "{{ package_name | replace('_', '-') }}"
    validator: >-
        {% if not (repo_name | regex_search('^[a-zA-Z][a-zA-Z_\\.\\-0-9]+$')) %}
        {{ repo_name }} is not a valid repo name. Use ASCII letters, digits, dashes and underscores only.
        {% endif %}

distribution_name:
    type: str
    help: |
        Name of the python distribution package that will be created.
        This is what people will `pip install`.
        Generally the same as the repo name unless there is a name clash on PyPI.
    default: "{{ repo_name }}"

author_name:
    type: str
    help: Your full name
    default: "{{ git_user_name() }}"
    placeholder: FirstName LastName

author_email:
    type: str
    help: Your email address
    default: "{{ git_user_email() }}"
    placeholder: email@diamond.ac.uk

# Internal variables
data_science:
    type: bool
    default: "{{ project_type == 'data_science' }}"
    when: false

data_science_layout:
    type: bool
    default: "{{ data_science and not competition }}"
    when: false

use_src_layout:
    type: bool
    default: "{{ layout == 'src' and project_type not in ['script', 'ros2', 'micropython'] }}"
    when: false

use_gpu_effective:
    type: bool
    default: "{{ use_gpu and project_type == 'data_science' }}"
    when: false

repo_url:
    type: str
    default: "https://github.com/{{github_org}}/{{repo_name}}"
    when: false

docs_url:
    type: str
    default: "https://{{github_org | lower}}.github.io/{{repo_name}}"
    when: false

sphinx:
    type: bool
    default: "{{ docs_type == 'sphinx' }}"
    when: false

zensical:
    type: bool
    default: "{{ docs_type == 'zensical' }}"
    when: false

great_docs:
    type: bool
    default: "{{ docs_type == 'great-docs' }}"
    when: false

docs:
    type: bool
    default: "{{ docs_type != 'README' }}"
    when: false

ros2_pkg:
    type: bool
    default: "{{ project_type == 'ros2' }}"
    when: false

ros2_cpp:
    type: bool
    default: "{{ ros2_pkg and pkg_language == 'cpp' }}"
    when: false

ros2_python:
    type: bool
    default: "{{ ros2_pkg and pkg_language == 'python' }}"
    when: false

micropython_pkg:
    type: bool
    default: "{{ project_type == 'micropython' }}"
    when: false

task_runner_effective:
    type: str
    default: "{{ task_runner_pixi if package_manager == 'pixi' else task_runner }}"
    when: false

license_effective:
    type: str
    default: "{{ license }}"
    when: false

proprietary:
    type: bool
    default: "{{ license_effective in ['Proprietary', 'Confidential'] }}"
    when: false

reuse_effective:
    type: bool
    default: "{{ fair and not proprietary }}"
    when: false

duo:
    type: bool
    default: "{{ data_reusable and data_science_layout }}"
    when: false

care:
    type: bool
    default: "{{ data_ethics and data_science_layout }}"
    when: false

license_year:
    type: str
    default: "{{ current_year() }}"
    when: false

pkg_dir:
    type: str
    default: "{{ 'src/utils' if competition else (('src/' if use_src_layout else '') + package_name) }}"
    when: false

_subdirectory: "template"

_skip_if_exists:
    - CHANGELOG.md

_tasks:
    - command: >-
        python -c "import sys; print('Django is not supported by this template. Use FastAPI / Litestar / Flask instead, or the upstream cookiecutter-django template: https://github.com/cookiecutter/cookiecutter-django'); sys.exit(1)"
      when: "{{ project_type == 'web_django' }}"
    - >-
        {% if ascii_banner %}
        python -B tools/ascii_banner.py {{ repo_name }} README.md
        {% endif %}
    - >-
        {% if reuse_effective %}
        python -c "import pathlib, shutil; pathlib.Path('LICENSES').mkdir(exist_ok=True); shutil.copy('LICENSE', 'LICENSES/{{ license_effective }}.txt')"
        {% endif %}

_migrations:
    - version: 2.0.0
      before:
          - echo This update will require you to login to pypi.org and make changes before you can make a new release to PyPI. If you do not have time to do this now, press CTRL+C to abort this update.
      after:
          - echo Visit https://diamondlightsource.github.io/python-copier-template/main/how-to/pypi.html to find out how to set up PyPI trusted publishing
