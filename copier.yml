_jinja_extensions:
    - copier_template_extensions.TemplateExtensionLoader
    - extensions.py:GitExtension
    - extensions.py:CurrentYearExtension

# Template Options
detail_level:
    type: str
    help: |
        How much would you like to customise?
        - simple: ask only the essential questions, use defaults for the rest.
        - detailed: ask about every option (CI provider, package manager,
          GPU, docs tool, integrations, ...).
    choices:
        - simple
        - detailed
    default: detailed

package_manager:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Which package manager would you like to use?
        - uv: Fast, pure Python package manager with a pip-like workflow.
        - pixi: Conda-based package manager with cross-language support.
        - poetry: Dependency management and packaging with Poetry.
        Choose pixi if you need native (non-Python) dependencies.
    choices:
        - uv
        - pixi
        - poetry
    default: uv

task_runner:
    type: str
    when: "{{ detail_level == 'detailed' and package_manager != 'pixi' }}"
    help: |
        Which task runner would you like to use to drive lint / type-check /
        test / docs (and, for data_science's competition sub-option, the ML
        pipeline shortcuts)?
        - just: Just. Simple justfile, external binary.
        - task: Task (go-task). YAML, external binary, used by CI too.
        - poe: poethepoet. Pure Python, lives in pyproject.toml, no extra
          binary to install (just a dev dependency).
        - make: GNU Make. Universally available, terse Makefile syntax.
    choices:
        Just: just
        Task (go-task): task
        poethepoet: poe
        Make: make
    default: just

task_runner_pixi:
    type: str
    when: "{{ detail_level == 'detailed' and package_manager == 'pixi' }}"
    help: |
        Which task runner would you like to use? (poethepoet doesn't work
        with pixi, so pixi's own native tasks take its place here.)
        - pixi: pixi's own native tasks (`pixi run <name>`). No extra tool.
        - task: Task (go-task). YAML, external binary, used by CI too.
        - just: Just. Simple justfile, external binary.
        - make: GNU Make. Universally available, terse Makefile syntax.
    choices:
        pixi (native tasks): pixi
        Task (go-task): task
        Just: just
        Make: make
    default: pixi

project_type:
    type: str
    help: |
        What kind of project is this?
        - library: a Python library/package.
        - web_api: a web API service (Docker included).
        - cli: a command-line tool.
        - data_science: a data science project with notebooks, data/,
          models/, reports/ and experiment extras. GPU Dockerfile and
          Quarto paper are included.
        - script: a minimal script, no package layout.
    choices:
        - library
        - web_api
        - cli
        - data_science
        - script
    default: library

competition:
    type: bool
    when: "{{ detail_level == 'detailed' and project_type == 'data_science' }}"
    help: |
        Is this a Kaggle-style competition project?
        If yes, input/ and exp/ directories are added for competition data
        and experiments.
    default: false

use_gpu:
    type: bool
    when: "{{ detail_level == 'detailed' and project_type == 'data_science' }}"
    help: |
        Will you run GPU workloads?
        If yes, an NVIDIA CUDA Dockerfile and devcontainer are prepared.
        In simple mode, this is enabled for data_science projects.
    default: true

layout:
    type: str
    when: "{{ detail_level == 'detailed' and project_type != 'data_science' }}"
    help: |
        Which layout would you like to use for the package?
        - src: package in a src/ directory (recommended, prevents accidental
               imports of an uninstalled package).
        - flat: package at the repository root.
    choices:
        - src
        - flat
    default: src

allow_japanese:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Allow Japanese (multibyte) characters in comments and docstrings?
        If true, ruff's line-length and max-doc-length are relaxed so that
        wide multibyte characters do not trigger E501/D rules.
    default: false

ascii_banner:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Add an ASCII-art banner of the repo name to the top of the README?
        This bundles a small MIT-licensed copy of pyfiglet (with the slant
        font) so the banner can be regenerated without extra dependencies.
    default: true

docker:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Would you like to publish your project in a Docker container?
        You should select this if you are making a service.

docs_type:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Which documentation tool would you like to use?
        - README: just a README, no dedicated docs site.
        - zensical: Zensical, an MkDocs fork with mkdocstrings. Fast to set up.
        - sphinx: Sphinx with the pydata theme. More powerful, more config.
        - great-docs: Great Docs, a Quarto-based tool. Requires Quarto installed.
    choices:
        - README
        - zensical
        - sphinx
        - great-docs
    default: zensical

type_checker:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        What type checker would you like to use?
        Basedpyright (pyright の fork) is recommended: 実バグ検出を重視しつつ、
        警告レベルを制御しやすい。Pyrefly (Meta) は軽量で補助に使える。
    choices:
        - basedpyright
        - pyrefly

strictness:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        How strict should the toolchain be? One axis controls both the
        type-annotation requirements and the static-analysis toolchain.
        - none: pytest + ruff (minimal rules), no type checking.
        - basic: pytest + ruff, no type checking.
        - recommended: ruff (ALL rules), basedpyright + pyrefly,
          typos/vulture/deptry/pip-audit, driven by your chosen task runner.
          Recommended default.
        - full: recommended + strict type checking (Any forbidden),
          minimized ruff ignores, full annotations required.
    choices:
        - none
        - basic
        - recommended
        - full
    default: recommended

fair:
    type: bool
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Add FAIR research-software metadata?
        - CITATION.cff for software citation, validated by a pre-commit hook
          (an optional ORCID iD is asked below when enabled)
        - REUSE.toml with SPDX annotations, checked by the reuse hook — but
          only when an open-source license is selected; Proprietary projects
          skip REUSE
    default: false

data_governance:
    type: str
    when: "{{ detail_level == 'detailed' and fair and data_science and not competition }}"
    help: |
        Which research-data governance frameworks should be documented for
        the data/ directory?
        - duo: a DUO (Data Use Ontology) data-use conditions sheet
        - care: a CARE principles data-governance statement
        - both: both sheets
        - none: skip
    choices:
        none: none
        DUO only: duo
        CARE only: care
        DUO + CARE: both
    default: none

license_simple:
    type: str
    when: "{{ detail_level == 'simple' }}"
    help: Which license would you like to use?
    choices:
        MIT License: MIT
        Proprietary / all rights reserved: Proprietary
    default: MIT

license:
    type: str
    when: "{{ detail_level == 'detailed' }}"
    help: |
        Which license would you like to use?
        The full list from https://choosealicense.com, generated by
