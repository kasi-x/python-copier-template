# The questionnaire, as a table of contents.
#
# How a render flows, top to bottom:
#
#   questions/01..17-*.yml   the answers (asked in file-number order)
#        |
#   questions/90-derived.yml values computed from the answers (never asked)
#   questions/91-structured  the dependency and src/ directory lists
#        |
#        |
#   template/ + partials/    what each generated file contains (Jinja)
#        |
#   _tasks (below)           commands run after the files are written
#
# Every question lives in questions/, one file per area, and the number in
# the file name IS the ask order: copier asks 01 first and 99 last. To change
# a question, open the file whose name matches its area; to see everything a
# question touches, run `architekton-py where <question>`.
#
# The order is not cosmetic. A question may only read answers asked before
# it (tests/test_copier_structure.py enforces this), so:
# - 01-project-type comes first: the area gates and many defaults read it.
# - The use_recommended_* gates keep their canonical relative order
#   (CANONICAL_GATES in that test). Each asks "use the recommended
#   settings?" (default: yes); answering No reveals the area's details.
# - A genre's derived internals (micropython_pkg, online_judge, kaggle,
#   oj_code) live in that genre's file, before anything that reads them.
# - 08-layers (include_* opt-ins and the has_* booleans) follows
#   07-online-judge (it reads kaggle) and precedes 09-data-science and
#   15-web-api (their gates read has_data_science / has_web_api).
# - 90-derived holds internal values nobody is asked (when: false); 91-structured
#   holds the dependency / src-dir lists whose defaults read 90-derived.
# - 99-files is the table of which generated files exist for which answers;
#   it reads everything above, so it comes last. Paths computed from answers
#   (`{{ pkg_dir }}`, the uv.lock / pixi.lock swap) keep `{% if %}` in their
#   names instead; architekton/file_gates.py reads both layers back.
#
# Each include is its own YAML document: two `!include` tags in one document
# would collide as the same mapping key.
!include questions/01-project-type.yml
---
!include questions/02-adoption.yml
---
!include questions/03-ros2.yml
---
!include questions/04-micropython.yml
---
!include questions/05-agent.yml
---
!include questions/06-toolchain.yml
---
!include questions/07-online-judge.yml
---
!include questions/08-layers.yml
---
!include questions/09-data-science.yml
---
!include questions/10-polish.yml
---
!include questions/11-docs.yml
---
!include questions/12-quality.yml
---
!include questions/13-license.yml
---
!include questions/14-integrations.yml
---
!include questions/15-web-api.yml
---
!include questions/16-security.yml
---
!include questions/17-project-details.yml
---
!include questions/90-derived.yml
---
!include questions/91-structured.yml
---
!include questions/99-files.yml
---
# Template settings (underscore keys). Copier merges these across fragments;
# they are kept here in one place so the template's runtime behaviour is
# documented in a single spot. `questions/` holds the include fragments, so
# it must never be copied into a generated project.
_subdirectory: "template"

_exclude:
    - questions
    # `.gate` files are template-editors' markers (a sibling `name.gate` or
    # in-dir `.gate` holds the path's condition); questions/99-files.yml is
    # generated from them, they are never rendered themselves.
    - "*.gate"
    # questions/99-files.yml: every path whose condition is false. `copier
    # update` also applies this list while it re-renders the project's *old*
    # template version, which may predate the table: hence the default.
    - "{% for path, keep in (file_gates | default({})).items() if not keep %}/{{ path }}\n{% endfor %}"

_skip_if_exists:
    - CHANGELOG.md

_tasks:
    # The answers copier overrides or discards silently: questions/90-derived.yml's
    # `zensical` micropython redirect and `license_effective` AGPL force (two
    # overrides), plus security_policy / scorecard, whose answers
    # `security_policy_effective` / `scorecard_effective` zero out everywhere
    # but github.com (one discard). Validators can neither warn nor rewrite,
    # and in all three cases the overriding or gating answer is asked after
    # the answers it affects -- and copier has no pre-copy task stage -- so
    # the first generation tasks say so on stderr (the silent-discard rule in
    # docs/explanations/template-dev.md).
    - command: >-
        echo "WARNING: micropython projects cannot build sphinx docs (nothing importable to autodoc); this render uses zensical instead of your sphinx answer." >&2
      when: "{{ micropython_pkg and docs_type == 'sphinx' }}"
    - command: >-
        echo "WARNING: memorious4 is AGPL-3.0; this render licenses the project AGPL-3.0 instead of your {{ license }} answer." >&2
      when: "{{ scraping_memorious_effective and license != 'AGPL-3.0' }}"
    - command: >-
        echo "WARNING: SECURITY.md and the OpenSSF Scorecard workflow render only on github.com (GitHub-only advisory and badge machinery), so this {{ git_platform }} project's answers to security_policy / scorecard produced nothing." >&2
      when: "{{ git_platform != 'github.com' and (security_policy or scorecard) }}"
    - command: >-
        python -c "print('Adopt mode: your own files (README.md, LICENSE, pyproject.toml, .gitignore, .python-version, src/tests) were protected and not touched.'); print('Added infrastructure: .github/workflows, .gitleaks.toml, renovate.json, AGENTS.md and more — see git status.'); print('Wire the tooling into your own pyproject.toml, e.g.: uv add --dev ruff pytest pytest-cov typos deptry vulture basedpyright'); print('Task entry points to copy: see justfile / Taskfile.yml.'); print('Files the template also ships (.github/workflows/ci.yml, renovate.json, cliff.toml, ...) are replaced unless you passed --skip <path>; git diff shows exactly what changed.'); print('Update later with: uvx copier update --trust --defaults')"
      when: "{{ existing_project }}"
    - command: |
        echo "Fresh project — suggested next steps:"
        echo '  * git add -A && git commit -m "chore: scaffold from architekton-py"'
        echo '  * git remote add origin {{ repo_url }}.git && git push -u origin main'
        {% if docs %}
        echo '  * after the first docs job succeeds, enable GitHub Pages:'
        echo '    Settings → Pages → Deploy from a branch → gh-pages (root)'
        {% endif %}
        {% if pypi %}
        echo '  * PyPI: create a trusted publisher for this repo (docs/how-to/pypi)'
        {% endif %}
        echo '  * branch protection: Settings → Branches (require the CI checks)'
      when: "{{ not existing_project }}"
    - >-
        {% if reuse_effective %}
        python -c "import pathlib, shutil; pathlib.Path('LICENSES').mkdir(exist_ok=True); shutil.copy('LICENSE', 'LICENSES/{{ license_effective }}.txt')"
        {% endif %}
    # `src_dirs` entries the template tree does not already carry (the tree
    # materializes the known vocabulary -- data/features/models/visualization
    # and kaggle's input/logs/output/scripts -- each gated on being in the
    # list). A *file tree* cannot express "a directory with an arbitrary
    # name", so a user who adds `experiments` to the list gets it from here.
    # `mkdir -p` + `touch` is idempotent; an existing .gitkeep is left alone.
    # No shell-quoting of the Python source: the values travel as argv.
    - command: |
        python -c 'import pathlib, sys
        for d in sys.argv[1:]:
            p = pathlib.Path("src") / d
            p.mkdir(parents=True, exist_ok=True)
            (p / ".gitkeep").touch()' {{ src_dirs | map('quote') | join(' ') }}
      when: "{{ src_dirs }}"
    # Fill the AGENTS.md rules marker block from the guidance sections right after render,
    # in the questionnaire's language (`en` renders the sections' `en:` blocks,
    # `ja` the Japanese prose): offline-tolerant on purpose (uvx fetches
    # daimonion from git), so a failure prints guidance and never fails
    # generation; the generated CI's ethics-block job
    # (`daimonion --lang <agents_md_language> agents-md --check`) then fails
    # until the block is filled. daimonion is pinned to a commit via
    # `daimonion_spec` (questions/90-derived.yml) -- move to a hash-pinned
    # PyPI release once daimonion is published.
    - command: |
        uvx --from {{ daimonion_spec }} daimonion --lang {{ agents_md_language | default('en') }} agents-md --write || echo "WARNING: could not render the AGENTS.md rules block (offline?); run 'uvx --from {{ daimonion_spec }} daimonion --lang {{ agents_md_language | default('en') }} agents-md --write' once network is available." >&2
      when: "{{ agents_md_effective }}"

_migrations:
    - version: 2.0.0
      before:
          - echo This update will require you to login to pypi.org and make changes before you can make a new release to PyPI. If you do not have time to do this now, press CTRL+C to abort this update.
      after:
          - echo Visit https://politeuma.github.io/architekton-py/main/how-to/pypi.html to find out how to set up PyPI trusted publishing
