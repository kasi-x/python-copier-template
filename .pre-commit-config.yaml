repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^(uv|pixi)\.lock
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # uv/pixi lockfiles are machine-generated and may not end in a newline.
        # .jinja sources deliberately control their own trailing newline (see
        # docs/explanations/template-dev.md): an include/wrapper file that ends
        # right after a `{% include %}`/`{% endif %}` tag with no newline avoids
        # doubling up a blank line in the rendered output. The generated output's
        # own newline hygiene is enforced separately by
        # test_generated_files_end_with_single_newline, not by this hook.
        exclude: ^(uv|pixi)\.lock$|\.jinja$

  - repo: local
    hooks:
      - id: ruff
        name: lint with ruff
        language: system
        entry: ruff check --force-exclude --fix
        types: [python]
        require_serial: true

      - id: ruff-format
        name: format with ruff
        language: system
        entry: ruff format --force-exclude
        types: [python]
        require_serial: true

      - id: lock-sync
        name: sync lockfile and environment
        pass_filenames: false
        language: system
        entry: bash -c 'if [ -f pixi.lock ]; then pixi install; else uv sync; fi'
        files: ^(uv\.lock|pixi\.lock|pyproject\.toml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        name: nbstripout
        description: "nbstripout: strip output from Jupyter and IPython notebooks"
        entry: nbstripout
        language: python
        types: [jupyter]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        language: golang
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/citation-file-format/cff-converter-python
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
