# Cross-cutting questions, block B: polish, docs, quality, license and
# integrations gates with their detail questions. Asked between the genre
# blocks (data_science / online_judge before, web_api after) in the include
# order, matching the canonical gate order.

use_recommended_polish:
    type: bool
    default: true
    help: |
        Use the recommended layout & repo polish?
        Recommended: src/ layout (library/cli), no Japanese (multibyte)
        characters in comments/docstrings.
        Answer No to change the layout or allow Japanese text.

layout:
    type: str
    when: "{{ project_type not in ['data_science', 'online_judge', 'ros2', 'micropython', 'web_api'] and not use_recommended_polish }}"
    help: |
        Which layout would you like to use for the package?
        - src: package in a src/ directory (recommended, prevents accidental
               imports of an uninstalled package).
        - flat: package at the repository root.
        (web_api always uses a top-level app/ package instead.)
    choices:
        - src
        - flat
    default: src

allow_japanese:
    type: bool
    when: "{{ not use_recommended_polish }}"
    help: |
        Allow Japanese (multibyte) characters in comments and docstrings?
        If true, ruff's line-length and max-doc-length are relaxed so that
        wide multibyte characters do not trigger E501/D rules.
    default: false

use_recommended_docs:
    type: bool
    default: true
    help: |
        Use the recommended documentation tool?
        Recommended: zensical (Zensical, an MkDocs fork with mkdocstrings).
        Answer No to pick README-only, Sphinx or Great Docs instead.
        (For ros2 projects the docs build needs a sourced ROS environment,
        e.g. the devcontainer or CI.)

docs_type:
    type: str
    when: "{{ not use_recommended_docs }}"
    help: |
        Which documentation tool would you like to use?
        - README: just a README, no dedicated docs site.
        - zensical: Zensical, an MkDocs fork with mkdocstrings. Fast to set up.
        - sphinx: Sphinx with the pydata theme. More powerful, more config.
        - great-docs: Great Docs, a Quarto-based tool. Requires Quarto installed.
        (For micropython projects, Sphinx is not offered: the firmware is not
        a CPython-importable package, and zensical can document firmware/core.
        Answering sphinx for a micropython project falls back to zensical.)
    choices: [README, zensical, sphinx, great-docs]
    default: zensical

use_recommended_quality:
    type: bool
    default: true
    help: |
        Use the recommended type checker & strictness level?
        Recommended: basedpyright (primary) + pyrefly (additional static
        analysis), strictness "recommended" (ruff ALL rules,
        typos/vulture/deptry/pip-audit).
        Answer No to pick a different secondary checker or strictness level.

type_checker:
    type: str
    when: "{{ not use_recommended_quality }}"
    help: |
        Which additional static-analysis checker should run alongside
        basedpyright? (basedpyright is always the primary type checker.)
        - pyrefly: Meta's lightweight type checker. Recommended: it has been
          used by this template longest and is stable in production.
        - ty: Astral's fast Rust type checker (complements basedpyright with
          a second, independent analysis pass; currently in beta).
    choices:
        - pyrefly
        - ty
    default: pyrefly

strictness:
    type: str
    when: "{{ not use_recommended_quality }}"
    help: |
        How strict should the toolchain be? One axis controls both the
        type-annotation requirements and the static-analysis toolchain.
        - none: pytest + ruff (minimal rules), no type checking.
        - basic: pytest + ruff, no type checking.
        - recommended: ruff (ALL rules), basedpyright + the secondary checker
          (pyrefly by default), typos/vulture/deptry/pip-audit, driven by your
          chosen task runner. Recommended default.
        - full: recommended + strict type checking (Any forbidden),
          minimized ruff ignores, full annotations required.
    choices:
        - none
        - basic
        - recommended
        - full
    default: recommended

use_recommended_license:
    type: bool
    default: true
    help: |
        Use the recommended license & metadata settings?
        Recommended: MIT license, no FAIR research-software metadata
        (CITATION.cff / REUSE).
        Answer No to pick a different license or opt into FAIR metadata.

license:
    type: str
    when: "{{ not use_recommended_license }}"
    help: |
        Which license would you like to use?
        The full list from https://choosealicense.com, generated by
        tools/generate_license_template.py.
    choices:
        Academic Free License v3.0: AFL-3.0
        Apache License 2.0: Apache-2.0
        Artistic License 2.0: Artistic-2.0
        BSD 2-Clause "Simplified" License: BSD-2-Clause
        BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
        BSD 3-Clause Clear License: BSD-3-Clause-Clear
        BSD 4-Clause "Original" or "Old" License: BSD-4-Clause
        BSD Zero Clause License: 0BSD
        BSD-2-Clause Plus Patent License: BSD-2-Clause-Patent
        Blue Oak Model License 1.0.0: BlueOak-1.0.0
        Boost Software License 1.0: BSL-1.0
        CERN Open Hardware Licence Version 2 - Permissive: CERN-OHL-P-2.0
        CERN Open Hardware Licence Version 2 - Strongly Reciprocal: CERN-OHL-S-2.0
        CERN Open Hardware Licence Version 2 - Weakly Reciprocal: CERN-OHL-W-2.0
        CeCILL Free Software License Agreement v2.1: CECILL-2.1
        Creative Commons Attribution 4.0 International: CC-BY-4.0
        Creative Commons Attribution Share Alike 4.0 International: CC-BY-SA-4.0
        Creative Commons Zero v1.0 Universal: CC0-1.0
        Do What The F*ck You Want To Public License: WTFPL
        Eclipse Public License 1.0: EPL-1.0
        Eclipse Public License 2.0: EPL-2.0
        Educational Community License v2.0: ECL-2.0
        European Union Public License 1.1: EUPL-1.1
        European Union Public License 1.2: EUPL-1.2
        GNU Affero General Public License v3.0: AGPL-3.0
        GNU Free Documentation License v1.3: GFDL-1.3
        GNU General Public License v2.0: GPL-2.0
        GNU General Public License v3.0: GPL-3.0
        GNU Lesser General Public License v2.1: LGPL-2.1
        GNU Lesser General Public License v3.0: LGPL-3.0
        ISC License: ISC
        LaTeX Project Public License v1.3c: LPPL-1.3c
        MIT License: MIT
        MIT No Attribution: MIT-0
        Microsoft Public License: MS-PL
        Microsoft Reciprocal License: MS-RL
        Mozilla Public License 2.0: MPL-2.0
        Mulan Permissive Software License, Version 2: MulanPSL-2.0
        Open Data Commons Open Database License v1.0: ODbL-1.0
        Open Software License 3.0: OSL-3.0
        PostgreSQL License: PostgreSQL
        SIL Open Font License 1.1: OFL-1.1
        The Unlicense: Unlicense
        Universal Permissive License v1.0: UPL-1.0
        University of Illinois/NCSA Open Source License: NCSA
        Vim License: Vim
        zlib License: Zlib
        Proprietary / all rights reserved: Proprietary
        Confidential / trade secrets: Confidential
    default: MIT

fair:
    type: bool
    when: "{{ not use_recommended_license }}"
    help: |
        Add FAIR research-software metadata?
        - CITATION.cff for software citation, validated in CI (cffconvert)
          (an optional ORCID iD is asked below when enabled)
        - REUSE.toml with SPDX annotations, checked by the reuse hook — but
          only when an open-source license is selected; Proprietary projects
          skip REUSE
        (data_science's DUO/CARE data-governance sheets are asked separately,
        under use_recommended_data_science — they don't depend on this.)
    default: false

author_orcid:
    type: str
    default: ""
    when: "{{ not use_recommended_license and fair }}"
    help: |
        Your ORCID iD (e.g. 0000-0002-1825-0099), recorded in CITATION.cff
        so citation systems can attribute you correctly. Leave empty to skip.
    validator: >-
        {% if author_orcid and not (author_orcid | regex_search('^([0-9]{4}-){3}[0-9]{3}[0-9X]$|^https://orcid.org/([0-9]{4}-){3}[0-9]{3}[0-9X]$')) %}
        {{ author_orcid }} is not a valid ORCID iD. Use 0000-0002-1825-0099 or https://orcid.org/0000-0002-1825-0099 (leave empty to skip).
        {% endif %}

use_recommended_integrations:
    type: bool
    default: true
    help: |
        Use the recommended deployment & integration settings?
        Recommended: no Docker container, no PyPI auto-publish, no cloud
        provider, no Sentry, no MCP support, GitHub Actions for CI,
        structlog for logging.
        Answer No to turn any of these on, switch the CI provider, or pick a
        different logging library.

docker:
    type: bool
    when: "{{ not use_recommended_integrations and project_type != 'micropython' and not (online_judge and not kaggle) }}"
    help: |
        Would you like to publish your project in a Docker container?
        You should select this if you are making a service.
    default: false

pypi:
    type: bool
    when: "{{ not use_recommended_integrations and not online_judge }}"
    help: Would you like the wheel and source distribution to be automatically uploaded to PyPI when a release is made?
    default: false

cloud_provider:
    type: str
    when: "{{ not use_recommended_integrations }}"
    help: |
        Which cloud provider will this project deploy to?
        - none: no cloud-specific code or dependencies.
        - aws: boto3 and service-specific dependencies are added.
        - gcp: google-cloud-storage is added.
        - azure: azure-identity is added.
    choices:
        - none
        - aws
        - gcp
        - azure
    default: none

aws_services:
    type: str
    when: "{{ not use_recommended_integrations and cloud_provider == 'aws' }}"
    help: |
        Which AWS services will you use?
        - essential: core services (S3, SQS, DynamoDB, Lambda types).
        - s3: just S3.
        - dynamodb: just DynamoDB.
        - sqs: just SQS.
        - lambda: just Lambda.
    choices:
        - essential
        - s3
        - dynamodb
        - sqs
        - lambda
    default: essential

include_sentry:
    type: bool
    when: "{{ not use_recommended_integrations }}"
    help: |
        Would you like to include Sentry for error tracking?
        If yes, sentry-sdk is added and initialised from SENTRY_DSN.
    default: false

include_mcp:
    type: bool
    when: "{{ not use_recommended_integrations and (project_type == 'cli' or project_type == 'web_api' or include_web_api) }}"
    help: |
        Publish this project as an MCP (Model Context Protocol) server?
        If yes, the mcp SDK (with its CLI) is added and an mcp_server.py
        is generated: a typed-tools example server you run over stdio,
        plus an in-process client test as a worked example of how to call
        it. A mcp-server-<name> console script is added too, so an MCP host
        can launch it (and, once published, users can run it with uvx).
        (For web_api projects the server lives in app/mcp_server.py;
        otherwise in <pkg>/mcp_server.py.)
    default: false

ci_provider:
    type: str
    when: "{{ not use_recommended_integrations }}"
    help: |
        Which CI provider would you like to use?
        - github_actions: GitHub Actions workflows for lint, type-checking,
          tests and docs.
        - none: no CI workflows are generated.
    choices:
        - github_actions
        - none
    default: github_actions

log_library:
    type: str
    when: "{{ not use_recommended_integrations and project_type not in ['ros2', 'micropython', 'online_judge'] }}"
    help: |
        Which logging library should logging_setup.py use?
        - structlog: structured, contextvars-aware logging with console/JSON
          renderers. Recommended default.
        - loguru: batteries-included logger — no boilerplate configuration,
          built-in colours, exception-catching decorator.
        - picologging: a C-accelerated, drop-in-compatible reimplementation
          of the standard library logging module. Faster, same API.
        - logging: the standard library logging module. No extra dependency.
    choices:
        - structlog
        - loguru
        - picologging
        - logging
    default: structlog
