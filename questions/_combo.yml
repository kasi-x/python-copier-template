# Combo follow-ups: opt-in layers on top of the single-choice base
# project_type (base + layer booleans, same idea as include_mcp).
#
# Raw/effective rule (see docs/explanations/template-dev.md): a question
# `when:` is written in RAW answers — a question is offered based on what
# was actually answered — while everything render-side (template bodies,
# file-name conditions, _tasks.jinja, the copier.yml tasks) reads the
# EFFECTIVE internals: the has_* booleans below and the *_effective family
# in questions/_internal.yml. The include_*.when gates here are the raw
# half of that rule; the internals at the bottom are its effective half.
#
# Ask order matters (enforced by
# tests/test_copier_structure.py::test_question_references_are_forward_only):
# this fragment sits after questions/online_judge.yml (it references kaggle)
# and before questions/data_science.yml and questions/web_api.yml (their gates
# reference has_data_science / has_web_api defined here).

include_data_science:
    type: bool
    when: "{{ project_type in ['library', 'cli', 'web_api'] }}"
    default: false
    help: |
        Add the data_science analysis layout (notebooks/, data/, models/,
        reports/, Quarto paper) on top of this project?
        The data_science detail questions follow when answered Yes.

include_web_api:
    type: bool
    when: "{{ project_type in ['library', 'cli', 'data_science'] or kaggle }}"
    default: false
    help: |
        Add the FastAPI scaffold (top-level app/ package) on top of this
        project? The web_api detail questions follow when answered Yes.
        (For full-stack needs use the upstream full-stack-fastapi-template —
        this stays a minimal, API-only scaffold.)
include_ctf:
    type: bool
    when: "{{ project_type in ['library', 'cli'] }}"
    default: false
    help: |
        Add a CTF participant workspace (challenges/<category>/<problem>/
        with a solve.py exploit starter, plus pwntools and z3-solver)?
        Participant-side only: per-problem folders with an executable
        template. Organiser scaffolds (Docker + socat + gdb) are out of
        scope — a separate-repo concern like IaC.
include_scraping:
    type: bool
    when: "{{ project_type == 'cli' }}"
    default: false
    help: |
        Add a polite web-fetching layer (robots.txt + rate limit + cache)?
        If yes, a fetcher module is generated and direct HTTP calls
        (requests / httpx / urlopen) are banned by ruff so every fetch goes
        through it. No CAPTCHA-solving helpers are ever generated — if a
        site blocks bots, use its API or ask permission. No new runtime
        dependencies for the recommended httpx fetcher.
use_recommended_scraping:
    type: bool
    when: "{{ include_scraping }}"
    default: true
    help: |
        Use the recommended web-fetching engine?
        Recommended: httpx — a polite stdlib-robots fetcher (contactable
        User-Agent, robots.txt check, per-host rate limiting, on-disk
        cache) with offline tests. No browser, no crawler framework.
        Answer No to pick scrapy / memorious / playwright instead (or all).
scraping_engine:
    type: str
    when: "{{ include_scraping and not use_recommended_scraping }}"
    help: |
        Which web-fetching engine should the fetcher layer prepare?
        - httpx: polite httpx fetcher (same as recommended).
        - scrapy: a Scrapy spider starter (ROBOTSTXT_OBEY + AUTOTHROTTLE +
          DOWNLOAD_DELAY enforced in settings, offline parse test).
        - memorious: a memorious crawler config (rate-limited, cached HTTP
          sessions). memorious4 is AGPL-3.0 — choosing it requires an
          AGPL-3.0 project license (enforced below).
        - playwright: a Playwright browser-fetch module (Chromium via
          `playwright install`; robots precheck + rate limit reused from
          the fetcher; no browser launch in tests).
        - all: prepare every engine above (all runtime dependencies).
        CAPTCHA-solving (2captcha-style) helpers are never generated —
        bypassing bot protection violates the site's terms.
    choices:
        - httpx
        - scrapy
        - memorious
        - playwright
        - all
    default: httpx

include_bot:
    type: bool
    when: "{{ project_type in ['cli', 'web_api'] }}"
    default: false
    help: |
        Add a long-running chat bot on top of this project (the long-running
        layer's second platform after the MCP server)?
        If yes, a bot module with its own entry point is generated and the
        detail questions follow when answered Yes. Discord, Slack and LINE are
        the generated platforms; Gmail is a planned choice on the same
        question, never a new project type.
use_recommended_bot:
    type: bool
    when: "{{ include_bot }}"
    default: true
    help: |
        Use the recommended bot platform?
        Recommended: discord = discord.py — the de-facto Discord library
        (async, typed, slash commands via app_commands, actively maintained,
        unlike the py-cord / nextcord forks).
        Answer No to pick a platform instead (discord, slack and line are the
        choices today; Gmail is planned).
bot_platform:
    type: str
    when: "{{ include_bot and not use_recommended_bot }}"
    help: |
        Which chat platform should the bot layer prepare?
        - discord: a discord.py bot (Gateway intents declared explicitly, a
          /ping app command, DISCORD_BOT_TOKEN from the environment with a
          startup check that refuses to start without it).
        - slack: a slack-bolt bot on Socket Mode (an outbound WebSocket, so
          there is no public endpoint to open or sign; an /app_mention
          listener that answers pong, and SLACK_BOT_TOKEN + SLACK_APP_TOKEN
          from the environment with a startup check that refuses to start
          without either).
        - line: a line-bot-sdk bot on the Messaging API (no long-polling and
          no socket, so the module serves LINE's webhook itself: a small
          FastAPI app whose POST /callback verifies the X-Line-Signature
          HMAC before answering a text ping with pong, and
          LINE_CHANNEL_SECRET + LINE_CHANNEL_ACCESS_TOKEN from the
          environment with a startup check that refuses to start without
          either). LINE listens on BOT_PORT (default 8000), unlike discord
          and slack, which only dial out.
        Gmail is a planned platform, not generated yet — it will be added
        here as a new choice, not as a new project type.
    choices:
        - discord
        - slack
        - line
    default: discord

combinable:
    type: bool
    default: "{{ project_type in ['library', 'cli', 'web_api', 'data_science'] or kaggle }}"
    when: false
# The include question's `when` / `combinable` / `has_*` trio is THREE
# deliberate layers, not one — do not collapse it:
# 1. each include_*.when (above) keeps the layer question from being ASKED
#    off a combinable base;
# 2. `combinable` rejects a FORCED answer (`--data-file` with
#    include_web_api=true) on a non-combinable base — real, because copier
#    applies a data-file answer even to a question whose `when` is false
#    (exactly why tests/test_answer_fixtures.py::
#    test_example_answers_keeps_every_gate_off must pin every gate
#    explicitly false instead of trusting the `when`);
# 3. `has_*` re-checks both (base or opt-in AND combinable) so a forced
#    include cannot leak into the render.

has_web_api:
    type: bool
    default: "{{ project_type == 'web_api' or (include_web_api and combinable) }}"
    when: false

has_data_science:
    type: bool
    default: "{{ project_type == 'data_science' or (include_data_science and combinable) }}"
    when: false
