# Adoption mode: applying the template onto an EXISTING project. When true,
# the adopter's own files (README, LICENSE, pyproject, .gitignore,
# .python-version, src/tests scaffolding, task-runner files) are protected —
# the render skips them entirely — while missing infrastructure (CI,
# hygiene, quality tooling) is still added. Spec: notes/SPEC-adoption.md.

existing_project:
    type: bool
    default: false
    help: |
        Apply this template to an EXISTING project?
        Yes: your README, LICENSE, pyproject.toml, .gitignore,
        .python-version and source scaffolding are protected — only files
        you do not have yet are added, plus the CI / quality
        infrastructure. No: full scaffold for a fresh project.

# Phase 2: fine-tune WHICH of your own files stay protected. CHANGELOG.md is
# always protected (see _skip_if_exists in copier.yml) and the task-runner
# files (justfile / Taskfile / Makefile / tasks.py / duties.py) are always
# skipped in adopt mode, so neither is a choice here.
adopt_protect:
    type: str
    multiselect: true
    default: [readme, license, pyproject, gitignore, python_version, scaffold]
    # entries map to the per-file render conditions in template/ file names
    choices: [readme, license, pyproject, gitignore, python_version, scaffold, docs]
    when: "{{ existing_project }}"
    help: |
        Which of your own files should stay protected (never written)?
        Deselect an entry to let the template (re)write that file.
