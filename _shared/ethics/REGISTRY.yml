    enforcement: L0
    status: active
    rendered_from: ["template/{% if agents_md_effective %}AGENTS.md{% endif %}.jinja"]
    superseded_by: null
    why: "FIPS 203/204/205 are function-divergent (KEM vs signatures) and the Kyber-era vernacular is stale; new crypto choices must be ML-KEM/ML-DSA based, hybrid, named by standard names."

  - id: baseline-pki-chain
