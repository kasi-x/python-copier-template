version: 1
# The single source for the ethics/regional/operational sections accumulated
# under _shared/ethics/. A row answers: what rule, which version, from which
# primary source, who it applies to, how strongly it is enforced, and where
# (if anywhere) it is distributed. A draft lives here as documentation only
# and no template/ file includes it (leaf +0); an active section is included
# from exactly the parents its row names in `rendered_from` (first promotion:
# the AGENTS.md ethics appendix, 2026-09).
#
# Lifecycle: draft (repo-local reference only) -> active (bundled as an
# appendix into an existing conditional doc, e.g. CHARTER/data appendix) ->
# kind (distributed on its own condition; the promotion PR wires the
# questionnaire, the witness leaves, invariants.yml and this registry row).
# `superseded_by` names the successor id; the file stays one version.
sections:
  - id: region-kyushu-ntp
    file: _shared/ethics/region/kyushu-ntp.md.jinja
    version: 2026-09-18.1
    effective: 2019-07-02
    review_by: 2026-12-18
    sources:
      - https://www.janog.gr.jp/meeting/janog41/application/files/9815/1692/5488/janog41-sp10ntp-fujimura-03.pdf
      - https://gigazine.net/news/20190702-fukuoka-u-ntp-server-shut-down/
      - https://xtech.nikkei.com/atcl/nxt/mag/nc/18/020600011/092500040/
    scope: {jurisdiction: [jp], sector: [telecom], category: []}
    scale: global
    audience: [iot, cli]
    enforcement: L0
    status: draft
    rendered_from: []
    superseded_by: null
    why: "Public NTP concentration case (Fukuoka University 133.100.9.2/133.100.11.8, clock.nc.fukuoka-u.ac.jp): single-IP hardcoding plus retry storms as the DDoS-to-self pattern. First sample section for the region bundle."

  - id: baseline-cra-obligations
    file: _shared/ethics/region/eu-cra.md.jinja
    version: 2026-09-21.1
    effective: 2026-09-11
    review_by: 2027-03-31
    sources:
      - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
      - https://digital-strategy.ec.europa.eu/en/policies/cra-reporting
    scope: {jurisdiction: [eu], sector: [], category: [supply-chain-security]}
    scale: regional
    audience: [library, cli, web, mcp]
    enforcement: L1
    status: active
    rendered_from: ["template/{% if agents_md_effective %}AGENTS.md{% endif %}.jinja"]
    superseded_by: null
    why: "Regulation (EU) 2024/2847 applies in stages: conformity-assessment notification since 2024-06-11, the reporting duty since 2026-09-11 (already live), the main obligations from 2027-12-11. It reaches non-EU developers who place products on the EU market, and art. 24's free-software exemption holds only while the work is non-commercial -- which is why the gate is the `distribution` answer (commercial), not a jurisdiction question: the answer that decides whether a regulator cares is monetisation, and asking a personal project about CE marking would be the over-distribution the ethics-appendix predicate calls uninvited. The mechanical half (SBOM generation, dependency vulnerability monitoring) is what a template can actually ship; the 24-hour reporting duty stays process, documented rather than automated. L1: tools/ethics.py's presence trigger fires on the code vocabulary, and the predicate asserts the section appears exactly where `distribution` selects it."

  - id: baseline-personal-data
    file: _shared/ethics/baseline/personal-data.md.jinja
    version: 2026-09-21.1
    effective: 2018-05-25
    review_by: 2027-03-31
    sources:
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj
      - https://www.ppc.go.jp/personalinfo/legal/
      - https://oag.ca.gov/privacy/ccpa
    scope: {jurisdiction: [], sector: [], category: [privacy]}
    scale: global
    audience: [library, cli, script, web, data-science, kaggle, mcp]
    enforcement: L1
    status: active
    rendered_from: ["template/{% if agents_md_effective %}AGENTS.md{% endif %}.jinja"]
    superseded_by: null
    why: "GDPR art. 4/5/17/22, Japan's 個人情報保護法 and the US state laws impose the same engineering duties from different directions: minimise what is collected and logged, make deletion reach every copy, and know what leaves the process. The section is asked rather than derived because the answers cannot tell a project that handles people from one that handles things -- a web API with a database stores `Item(name)`, and deriving 'has a DB therefore personal data' would ship these rules to 74 of 240 leaves, which is the over-distribution the ethics-appendix predicate calls uninvited. L1: tools/ethics.py's presence trigger fires on the code vocabulary, and the predicate asserts the section appears exactly where the answer selects it."

