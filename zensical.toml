[project]
site_name = "python-copier-template"
site_description = "A Copier template for Python projects"
site_author = "kasi-x"
repo_url = "https://github.com/kasi-x/python-copier-template"
repo_name = "kasi-x/python-copier-template"
edit_uri = "edit/main/docs/"

copyright = 'Maintained by <a href="https://github.com/kasi-x/python-copier-template">kasi-x</a>.'

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
      { "Overview" = "tutorials.md" },
      { "Create New Project" = "tutorials/create-new.md" },
      { "Installation" = "tutorials/installation.md" },
      { "Adopt Existing" = "tutorials/adopt-existing.md" },
  ]},
  { "How-To Guides" = [
      { "Overview" = "how-to.md" },
      { "Setup Repo" = "how-to/setup-repo.md" },
      { "Dev Install" = "how-to/dev-install.md" },
      { "Build Docs" = "how-to/build-docs.md" },
      { "Run Tests" = "how-to/run-tests.md" },
      { "Linting" = "how-to/lint.md" },
      { "Static Analysis" = "how-to/static-analysis.md" },
      { "Strict Mode" = "how-to/strict-mode.md" },
      { "Update Template" = "how-to/update-template.md" },
      { "Lock Requirements" = "how-to/lock-requirements.md" },
      { "Make Release" = "how-to/make-release.md" },
      { "PyPI" = "how-to/pypi.md" },
      { "ROS 2" = "how-to/ros2.md" },
      { "MicroPython" = "how-to/micropython.md" },
      { "Web API" = "how-to/web-api.md" },
      { "MCP Server" = "how-to/mcp.md" },
  ]},
  { "Explanations" = [
      { "Overview" = "explanations.md" },
      { "Structure" = "explanations/structure.md" },
      { "Why Use Template" = "explanations/why-use-template.md" },
      { "Long-Running Executables" = "explanations/long-running.md" },
      { "Security & Compliance" = "explanations/security.md" },
  ]},
  { "Reference" = [
      { "Overview" = "reference.md" },
      { "Questionnaire" = "reference/questionnaire.md" },
      { "Standards" = "reference/standards.md" },
  ]},
]

[project.theme]
name = "material"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins]
mkdocstrings = { default_handler = "python", handlers = { python = { paths = ["."] } } }
search = {}

[project.markdown_extensions]
admonition = {}
toc = { permalink = true }
pymdownx.superfences = {}
