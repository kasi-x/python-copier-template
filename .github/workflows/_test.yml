on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install, default is from .python-version file
        default: ""
      runs-on:
        type: string
        description: The runner to run this job on
        required: true
      task_runner:
        type: string
        description: Which task runner drives the test task (task, just, poe, make, invoke, duty, pixi)
        required: true
      task:
        type: string
        description: The test task to run (the PR/push caller passes the fast tier, the nightly caller the heavy tier)
        default: test
      timeout-minutes:
        type: number
        description: Job timeout in minutes (the heavy tier builds venvs, so it needs more than the fast one)
        default: 60
      postgres-host:
        type: string
        description: Host of the postgres service container, when the project needs a database
        default: ""
      postgres-port:
        type: string
        description: Port of the postgres service container
        default: "5432"
      postgres-user:
        type: string
        description: Username for the postgres service container
        default: ""
      postgres-password:
        type: string
        description: Password for the postgres service container
        default: ""
      postgres-db:
        type: string
        description: Database name for the postgres service container
        default: ""

permissions:
  contents: read

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # The checkout stays here, not in the composite: a local action's files
      # must exist before it can be invoked, so the composite cannot fetch the
      # repository it lives in (see setup-runner's description).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up the runner
        uses: ./.github/actions/setup-runner
        with:
          task_runner: ${{ inputs.task_runner }}
          uv_cache: true

      - name: Restore cached .venv
        # uv-only projects (the pixi/poetry installs skipped inside the
        # composite under the same condition). Keyed on the lockfile + pinned
        # python so a dependency or interpreter change rebuilds from scratch;
        # restore-keys falls back to the previous venv and `uv run --locked`
        # re-syncs just the delta (cheap thanks to setup-uv's own cache).
        # After the composite: it needs the checkout the composite performs,
        # and it restores a different directory than setup-uv caches, so the
        # order between the two does not matter.
        if: hashFiles('pixi.lock', 'poetry.lock') == ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: venv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-

      - name: Run tests
        env:
          TASK_RUNNER: ${{ inputs.task_runner }}
          # The test task to run: `test` by default, `test-fast` / `test-heavy`
          # from ci.yml so the PR/push run skips the venv tier and the nightly
          # run exercises exactly it.
          TEST_TASK: ${{ inputs.task }}
          # Postgres service container connection info (empty unless the
          # project opted in via ci.yml's postgres service).
          POSTGRES_HOST: ${{ inputs.postgres-host }}
          POSTGRES_PORT: ${{ inputs.postgres-port }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          POSTGRES_DB: ${{ inputs.postgres-db }}
          DATABASE_URL: ${{ inputs.postgres-host != '' && format('postgresql://{0}:{1}@{2}:{3}/{4}', inputs.postgres-user, inputs.postgres-password, inputs.postgres-host, inputs.postgres-port, inputs.postgres-db) || '' }}
        run: |
          set -eu
          case "$TASK_RUNNER" in
            task) task "$TEST_TASK" ;;
            just) just "$TEST_TASK" ;;
            make) make "$TEST_TASK" ;;
            poe)
              if [ -f poetry.lock ]; then
                poetry run poe "$TEST_TASK"
              else
                uv run --locked poe "$TEST_TASK"
              fi
              ;;
            invoke)
              if [ -f poetry.lock ]; then
                poetry run invoke "$TEST_TASK"
              else
                uv run --locked invoke "$TEST_TASK"
              fi
              ;;
            duty)
              if [ -f poetry.lock ]; then
                poetry run duty "$TEST_TASK"
              else
                uv run --locked duty "$TEST_TASK"
              fi
              ;;
            pixi) pixi run -e dev --locked "$TEST_TASK" ;;
            *) echo "Unknown task runner: $TASK_RUNNER" >&2; exit 1 ;;
          esac

      - name: Upload coverage to Codecov
        # Pushes to main only: PR uploads are noise (and fork PRs cannot
        # upload without the token anyway).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          name: ${{ inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
