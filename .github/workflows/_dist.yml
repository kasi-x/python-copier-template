on:
  workflow_call:
    inputs:
      version-command:
        type: string
        description: >-
          Shell command verifying the installed wheel (python -m <pkg>
          --version, or an import check for apps without a CLI). When empty,
          a src-layout guess keeps old callers working.
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      # The checkout stays here, not in the composite: a local action's files
      # must exist before it can be invoked, so the composite cannot fetch the
      # repository it lives in (see setup-runner's description).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up the runner
        uses: ./.github/actions/setup-runner
        with:
          uv_cache: true
      - name: Build sdist and wheel
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          if [ -f pixi.lock ]; then
            pixi exec --spec python-build pyproject-build
          elif [ -f poetry.lock ]; then
            poetry build
          else
            uvx --from build pyproject-build
          fi

      - name: Upload sdist and wheel as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

      - name: Check for packaging errors
        run: |
          if [ -f pixi.lock ]; then
            pixi exec --spec twine twine check --strict dist/*
          else
            uvx twine check --strict dist/*
          fi

      - name: Install produced wheel
        run: python -m pip install dist/*.whl

      - name: Test module --version works using the installed wheel
        env:
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_COMMAND" ]; then
            sh -c "$VERSION_COMMAND"
          else
            # Guess the package: src/ first, else the first top-level dir.
            pkg=$(find src -maxdepth 1 -mindepth 1 -not -name '*.egg-info' -type d 2>/dev/null | head -1)
            [ -n "$pkg" ] || pkg=$(find . -maxdepth 1 -mindepth 1 -not -name '*.egg-info' -not -name '.git' -not -name '.tox' -type d | head -1)
            python -m "$(basename "$pkg")" --version
          fi
