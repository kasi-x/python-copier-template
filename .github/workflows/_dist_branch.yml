on:
  # workflow_call only: ci.yml calls this on pushes to main. The `dist`
  # branch is the minimal deliverable — rendered preset trees, no template
  # machinery — so consumers who just want a project can
  # `git clone -b dist` or grab the branch zip without copier.
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish rendered presets to the dist branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Render all presets
        run: uv run --locked python architekton/gen_static.py --out rendered/

      - name: Push to dist branch
        run: |
          cd rendered
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add -A
          git commit -qm "dist: ${GITHUB_SHA}"
          git push -qf origin HEAD:refs/heads/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
