on:
  # workflow_call only: the caller is ci.yml's `static` job, gated on tag
  # pushes (same condition as `release`). Rendering every preset takes ~9s;
  # running it on every push would be wasted compute the release job never
  # consumes.
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static preset renders
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Render all presets to dist/
        # The ask-time questions stay dynamic (copier asks locally), but a
        # preset's *result* is static: gen_static.py renders every
        # presets/*.yml into dist/<name>/ plus an index.json manifest.
        run: uv run --locked python architekton/gen_static.py

      - name: Upload dist/
        # _release.yml's `download-artifact ... merge-multiple: true` picks
        # this up, so dist/<preset>/ trees ship as release assets alongside
        # docs.zip. Consumers wanting fewer bytes render locally from
        # questions/*.yml with copier (the same render this ran).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-renders
          path: dist/
