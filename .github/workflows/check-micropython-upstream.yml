name: Check MicroPython upstream

on:
  workflow_dispatch:
  schedule:
    # MicroPython ships roughly quarterly; check weekly that the template's
    # frozen-build tag still tracks the latest release.
    - cron: "0 6 * * MON"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Check MicroPython pins against upstream
        id: check
        run: python3 tools/check_micropython_upstream.py
        # The checker exits 1 when DEFAULT_TAG is behind the latest release.

      - name: Open drift issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(python3 tools/check_micropython_upstream.py 2>&1 || true)
          existing=$(gh issue list --search "MicroPython tag is behind upstream" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "MicroPython tag is behind upstream" \
              --body "$body"
          else
            echo "An issue for this drift is already open; skipping."
          fi
