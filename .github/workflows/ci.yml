name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  lint:
    uses: ./.github/workflows/_tasks.yml
    with:
      task_runner: task
      task: lint,type-check

  hygiene:
    uses: ./.github/workflows/_hygiene.yml

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-latest
      task_runner: task

  docs:
    uses: ./.github/workflows/_docs.yml
    with:
      task_runner: task
    permissions:
      contents: write

  example:
    needs: test
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_example.yml
    secrets:
      EXAMPLE_DEPLOY_KEY: ${{ secrets.EXAMPLE_DEPLOY_KEY }}

  release:
    needs: [test, docs]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write

  required-checks-passed:
    name: all required checks passed
    needs: [hygiene, lint, test, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          failing=$(echo '${{ toJSON(needs) }}' | jq -r '
            to_entries[] |
            select(.value.result != "success" and .value.result != "skipped") |
            "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
