on:
  workflow_call:
    inputs:
      task_runner:
        type: string
        description: Which task runner drives the tasks (task, just, poe, make, invoke, duty, pixi)
        required: true
      task:
        type: string
        description: Task name(s) to run, comma or space separated
        required: true


jobs:
  run:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        if: hashFiles('pixi.lock', 'poetry.lock') == ''
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install pixi
        if: hashFiles('pixi.lock') != ''
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Install poetry
        if: hashFiles('poetry.lock') != ''
        uses: snok/install-poetry@v1

      - name: Install Task
        if: inputs.task_runner == 'task'
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        if: inputs.task_runner == 'just'
        uses: extractions/setup-just@v2

      - name: Install MicroPython stubs
        if: hashFiles('requirements-dev.txt') != '' && hashFiles('pixi.lock', 'poetry.lock') == ''
        run: uv run --locked pip install -r requirements-dev.txt --target typings

      - name: Run tasks
        env:
          TASK_RUNNER: ${{ inputs.task_runner }}
          TASKS: ${{ inputs.task }}
        run: |
          set -eu
          for t in $(echo "$TASKS" | tr ',' ' '); do
            case "$TASK_RUNNER" in
              task) task "$t" ;;
              just) just "$t" ;;
              make) make "$t" ;;
              poe)
                if [ -f poetry.lock ]; then
                  poetry run poe "$t"
                else
                  uv run --locked poe "$t"
                fi
                ;;
              invoke)
                if [ -f poetry.lock ]; then
                  poetry run invoke "$t"
                else
                  uv run --locked invoke "$t"
                fi
                ;;
              duty)
                if [ -f poetry.lock ]; then
                  poetry run duty "$t"
                else
                  uv run --locked duty "$t"
                fi
                ;;
              pixi) pixi run -e dev --locked "$t" ;;
              *) echo "Unknown task runner: $TASK_RUNNER" >&2; exit 1 ;;
            esac
          done
