name: E2E ecosystem

# Full cross-repo pipeline: law-map validate (corpus + guidance) ->
# architekton-py render -> daimonion fills the generated AGENTS.md rules
# block. The pairwise checks this complements (law-map CI's own validate,
# this repo's scheduled-check.yml `law-map-review-by`) each pin one edge; a
# schema change that keeps both edges green while breaking the handoff
# between them only shows here, where the whole chain runs.
#
# Weekly plus manual dispatch only: two checkouts and two `uv run` env
# syncs are too heavy for push/PR. Staggered from the other scheduled
# workflows (check-upstream.yml MON 06:00, check-upstream-fork.yml TUE 06:00,
# scheduled-check.yml TUE 07:00, periodic.yml WED 08:00,
# dependency-audit.yml THU 07:00, update-rehearsal.yml SUN 05:00, ci.yml
# nightly 03:00, witness.yml 04:00, scorecard.yml SAT 01:30) so a failure
# names exactly this pipeline.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * FRI"

jobs:
  e2e:
    name: law-map validate, architekton-py render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout law-map
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: politeuma/law-map
          path: law-map
          persist-credentials: false

      - name: Checkout architekton-py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: architekton-py
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Validate the law-map corpus and guidance tree
        working-directory: law-map
        run: |
          set -euo pipefail
          # validate defaults to this repo's own guidance/ tree: every
          # related_sections id must resolve to
          # guidance/sections/<tier>/<slug>.md; the manifest check proves the
          # generated MANIFEST.yml matches the section front matter.
          uv run law-map validate
          uv run law-map manifest --check
          # The assertion below proves the guidance sections themselves carry
          # the new shape (YAML front matter, not the old {# ethics: #}
          # headers): a schema change that drops the front matter keeps
          # validate green but breaks every downstream reader.
          python3 - <<'PY'
          import re
          from pathlib import Path
          import yaml

          root = Path("guidance/sections")
          files = sorted(p for p in root.rglob("*.md") if not p.name.startswith("_"))
          assert files, "guidance/sections holds no section files"
          manifest = yaml.safe_load((root / "MANIFEST.yml").read_text(encoding="utf-8"))
          assert manifest.get("schema") == 2, f"unexpected MANIFEST schema: {manifest.get('schema')}"
          bad = [str(p) for p in files if not p.read_text(encoding="utf-8").startswith("---\n")]
          assert not bad, f"guidance sections without YAML front matter: {bad}"
          print(f"guidance ok: {len(files)} section(s) with front matter, MANIFEST schema 2")
          PY

      - name: Render one project, fill the rules block, and check it
        working-directory: architekton-py
        run: |
          set -euo pipefail
          uv run --locked python -m architekton.cli new ../e2e-project --preset web-api --ref HEAD
          # --ref HEAD renders this checkout's working tree: the pipeline
          # tests today's template, not the newest release tag.
          #
          # The render declares its guidance `when` conditions in .daimonion.yml;
          # daimonion fills the AGENTS.md marker block from the guidance
          # sections, and --check proves the block is current. A derivation
          # change that silently drops a condition from the render keeps both
          # upstream checks green and fails here.
          test -f ../e2e-project/.daimonion.yml
          uvx --from git+https://github.com/politeuma/daimonion daimonion agents-md --write --repo ../e2e-project
          python3 - <<'PY'
          from pathlib import Path

          agents = Path("../e2e-project/AGENTS.md").read_text(encoding="utf-8")
          assert "<!-- daimonion:rules:begin" in agents, "the rules block markers are missing"
          assert "<!-- daimonion:rules:end -->" in agents, "the rules block end marker is missing"
          print("render ok: the daimonion rules block is present in AGENTS.md")
          PY
          uvx --from git+https://github.com/politeuma/daimonion daimonion agents-md --check --repo ../e2e-project

      - name: Open drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --search "E2E ecosystem pipeline failed" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "E2E ecosystem pipeline failed (scheduled check)" \
              --body "The weekly law-map validate -> architekton-py render pipeline broke with no repo changes involved: a schema or section-id change in one repo silently broke a downstream edge. See: $RUN_URL" \
              --label "documentation"
          else
            echo "An issue for this drift is already open; skipping."
          fi
