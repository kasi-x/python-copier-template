use_recommended_data_science: false
use_recommended_polish: false
use_recommended_docs: false
use_recommended_quality: false
use_recommended_license: false
use_recommended_integrations: false
use_recommended_security: false
security_policy: true
scorecard: false
author_email: kashimiya.exe@gmail.com
author_name: kashi-x
description: An expanded https://github.com/kasi-x/python-copier-template to illustrate how it looks with all the options enabled.
