version: '3'

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  lint:
    desc: Run pre-commit on all files
    cmd: uv run --locked pre-commit run --all-files --show-diff-on-failure

  type-check:
    desc: Run basedpyright + pyrefly + 静的解析
    cmds:
      - uv run --locked basedpyright
      - uv run --locked pyrefly check
      - uv run --locked vulture
      - uv run --locked deptry .
      - uv run --locked typos .

  test:
    desc: Run tests
    cmd: uv run --locked pytest

  docs:
    desc: Run docs build with zensical
    cmd: uv run --locked zensical build

  docs-serve:
    desc: Run docs server with zensical
    cmd: uv run --locked zensical serve {{ .CLI_ARGS }}

  check:
    desc: Run all quality checks
    deps: [lint, type-check, test, docs]
