[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "utils"
version = "0.1.0"
description = "Shared helpers for the Kaggle project."
requires-python = ">=3.11"
dependencies = [
    "structlog",
    "typer",
]

[tool.setuptools]
packages = ["utils", "utils.modeling"]
