[project.theme]
name = "material"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"

[palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"

[palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"
language = "ja"

[plugins.mkdocstrings]
default_handler = "python"

[plugins.mkdocstrings.handlers.python]
paths = [
    ".",
]

[plugins.search]

[markdown_extensions.admonition]

[markdown_extensions.toc]
permalink = true

[markdown_extensions.pymdownx.superfences]
